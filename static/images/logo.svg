<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#081c12" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b788" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#primaryGrad)" filter="url(#shadow)" />
  <rect x="5" y="5" width="90" height="90" rx="23" fill="none" stroke="rgba(82, 183, 136, 0.35)" stroke-width="1.5" />

  <!-- Modern Stylized Villa / House Roof Line -->
  <!-- Left wing roof -->
  <path d="M 22 52 L 50 25 L 78 52" fill="none" stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Chimney / High-rise tower accent -->
  <rect x="62" y="24" width="8" height="16" rx="2" fill="url(#goldGrad)" opacity="0.9" />

  <!-- House Body / Glass Foundation -->
  <path d="M 30 50 L 30 74 C 30 76.5 32 78 34.5 78 L 65.5 78 C 68 78 70 76.5 70 74 L 70 50 Z" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />

  <!-- AI Analytics Upward Growth Arrow (Inside House) -->
  <path d="M 37 68 L 47 58 L 54 63 L 64 47" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="58,47 64,47 64,53" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Modern Door / Foundation Pillar -->
  <rect x="46" y="66" width="8" height="12" rx="2" fill="url(#accentGrad)" />

  <!-- Sparkle / Tech Node Dot -->
  <circle cx="50" cy="25" r="3.5" fill="#fbbf24" />
</svg>
